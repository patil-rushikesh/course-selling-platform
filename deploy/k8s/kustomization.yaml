apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: course-platform
resources:
  - namespace.yaml
  - config.yaml
  - database.yaml
  - app.yaml
  - service.yaml
  - frontend.yaml
  - frontend-service.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: course-platform
    includeSelectors: false
    includeTemplates: true
# Secrets are provisioned separately; ingress is optional and needs your domain.
