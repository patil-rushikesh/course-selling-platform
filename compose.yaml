services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: course_selling
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U course -d course_selling']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: .
    image: course-platform:local
    init: true
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://course:${POSTGRES_PASSWORD}@database:5432/course_selling
      JWT_USER_PASSWORD: ${JWT_USER_PASSWORD:?Set JWT_USER_PASSWORD}
      JWT_ADMIN_PASSWORD: ${JWT_ADMIN_PASSWORD:?Set JWT_ADMIN_PASSWORD}
      ADMIN_SIGNUP_KEY: ${ADMIN_SIGNUP_KEY:?Set ADMIN_SIGNUP_KEY}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SLOW_REQUEST_MS: ${LOG_SLOW_REQUEST_MS:-1000}
      LOG_HEALTH_CHECKS: ${LOG_HEALTH_CHECKS:-false}
      # Compose is bound to loopback and uses HTTP for local development.
      HTTPS_ONLY: 'false'
      TRUST_PROXY_HOPS: '1'
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: course-frontend:local
    ports:
      - '127.0.0.1:3000:8080'
    environment:
      BACKEND_ORIGIN: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
